[project]
name = "fab-ai-assistant"
version = "0.1.0"
description = "AI-based semiconductor FAB incident response chat assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "streamlit>=1.37,<2.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]
data = [
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
]
rag = [
  "openai>=1.50,<2.0",
  "pymilvus>=2.4,<3.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/assistant/src", "apps/assistant"]
testpaths = ["apps/assistant/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
