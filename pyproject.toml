[project]
name = "fab-ai-assistant"
version = "0.1.0"
description = "AI-based semiconductor FAB incident response chat assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]
data = [
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
]
rag = [
  "chromadb>=0.5,<1.0",
  "openai>=1.50,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

