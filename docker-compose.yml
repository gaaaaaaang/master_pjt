services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fab
      MYSQL_USER: fab_user
      MYSQL_PASSWORD: fab_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  mysql_data:
  chroma_data:

