services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fab
      POSTGRES_USER: fab_user
      POSTGRES_PASSWORD: fab_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
